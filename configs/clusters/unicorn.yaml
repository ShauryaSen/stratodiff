# Sarah Dean's group nodes. Data on dean-compute-02's local scratch (DECISIONS D9), so jobs are pinned there.
name: unicorn
data_root: /scratch/sps252/stratodiff
runs_root: /home/sps252/stratodiff-runs
partition: dean
account: dean
nodelist: dean-compute-02
gpus: 1
cpus: 8
mem_gb: 64
hours: 24
disk_budget_tb: 1.0  # D10: at most 1 TB of scratch at once
setup:  # batch jobs get no login shell, so uv is not on PATH by default
  - export PATH=$HOME/.local/bin:/usr/local/slurm/current/bin:$PATH
  - cd $HOME/stratodiff
