[project]
name = "stratodiff"
version = "0.0.1"
description = "Diffusion generator of global stratospheric wind for balloon navigation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
data = ["numcodecs", "zarr", "xarray"]  # ingest (M1)
train = ["torch"]  # stages and sampling (M3 on); earth2grid joins when the U-Net is built

[project.scripts]
stratodiff = "stratodiff.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stratodiff"]

[tool.pytest.ini_options]
markers = [
    "network: needs the internet (skipped by default)",
    "gpu: needs a GPU (skipped by default)",
]
addopts = "-m 'not network and not gpu'"
